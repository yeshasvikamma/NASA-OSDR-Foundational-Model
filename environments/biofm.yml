name: biofm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools<71
  - numpy>=1.24,<2
  - pandas
  - scipy>=1.10,<1.14
  - scikit-learn
  - matplotlib
  - h5py
  - pyarrow
  - libstdcxx-ng>=12
  - pytorch::pytorch=2.3.1
  - pytorch::torchvision=0.18.1
  - pytorch::torchaudio=2.3.1
  - pytorch::pytorch-cuda=12.1
  - pip:
    - torch>=2.3,<2.4
    - numpy>=1.24,<2
    - performer-pytorch>=1.1.4
    - fair-esm>=2.0.0
    - archs4py>=1.0.4
    - torch-geometric>=2.5
    - fastparquet
    - safetensors
    - einops
    - lightning==2.2.5
    - torchmetrics>=1.3,<1.4
    - wandb
    - omegaconf
    - rich
