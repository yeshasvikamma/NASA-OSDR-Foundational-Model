# =============================================================================
# BulkFormer Pre-training Configuration
# =============================================================================
# Override any value from the CLI:
#   python pretrain_bulkformer.py training.lr=5e-5 training.batch_size=8
# =============================================================================

model:
  dim: 320
  bins: 10
  gb_repeat: 1
  p_repeat: 2
  bin_head: 8
  full_head: 4

training:
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 4
  max_epochs: 20
  patience: 3
  mask_ratio: 0.15
  accumulate_grad_batches: 8      # effective batch = batch_size * 8
  gradient_clip_val: 1.0
  precision: "16-mixed"           # bf16-mixed on Ampere+, 16-mixed elsewhere
  compile: true                   # torch.compile (PyTorch 2.0+)
  seed: 42

scheduler:
  warmup_steps: 500
  min_lr_ratio: 0.01              # cosine decays to lr * min_lr_ratio

data:
  data_dir: ../data
  num_workers: 4

logging:
  project: "nasa-osdr-bulkformer"
  run_name: null                  # auto-generated if null
  log_every_n_steps: 10

checkpoint:
  dirpath: ./bulkformer_checkpoints
  save_top_k: 3
